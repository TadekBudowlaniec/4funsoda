# ─── 4FUNSODA – konfiguracja Netlify ────────────────────────────────────────
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Strony miast (public/m/<slug>/index.html) są statyczne i serwowane wprost.
# Poniższy fallback dotyczy tylko nieistniejących ścieżek (aplikacja SPA).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Nagłówki bezpieczeństwa
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
